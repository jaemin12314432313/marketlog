<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}</style></head><body>
<title>CO-SHOW 3D 가상 시장 | 마켓로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* Layout: phone-first. One full-screen 3D exhibition hall (RE:LOCAL / 2026 CO-SHOW): dark floor, yellow accents, white booth partitions.
     HUD floats over it: title + minimap on top, info card above a joystick (left) and two buttons (right). */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #0052ff;
    --accent-ink: #ffffff;
    --good: #059669;
    --sky-top: #bfe2f1;
    --sky-bot: #f0ecdf;
    --chip: rgba(255, 255, 255, 0.92);
    --font-display: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101715; --surface: #18211e; --fg: #e8f1ed; --muted: #9bafa7; --line: #2a3833;
      --accent: #4d8bff; --accent-ink: #ffffff; --good: #4cc38a;
      --sky-top: #121c2b; --sky-bot: #2b2a31; --chip: rgba(24, 33, 30, 0.9);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101715; --surface: #18211e; --fg: #e8f1ed; --muted: #9bafa7; --line: #2a3833;
    --accent: #4d8bff; --accent-ink: #ffffff; --good: #4cc38a;
    --sky-top: #121c2b; --sky-bot: #2b2a31; --chip: rgba(24, 33, 30, 0.9);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .app { position: relative; height: 100%; overflow: hidden; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }

  .hud-x { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { position: absolute; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .plate { background: var(--chip); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; min-width: 0; }
  .plate small { display: block; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .plate strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.25; }
  .plate span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sample { pointer-events: auto; font-size: 12px; font-weight: 800; color: var(--accent); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; text-decoration: none; }
  .qbar.attr .qfill { background: var(--fill, var(--good)); }
  .qbar.attr b { color: var(--fill, var(--good)); font-weight: 700; }
  .qlink { display: block; text-align: center; text-decoration: none; margin-top: 8px; }

  .minimap { position: absolute; top: 60px; right: max(16px, env(safe-area-inset-right, 0px)); width: 72px; height: 93px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); pointer-events: none; }

  .toast { position: absolute; top: 72px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 130px); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }

  .card { position: absolute; bottom: 166px; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
  .card[hidden] { display: none !important; }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.2; }
  .card .meta { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .card .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-right: 6px; }
  .card .grade { flex: none; text-align: center; border: 2px solid var(--good); color: var(--good); border-radius: 9px; padding: 2px 10px 3px; line-height: 1.1; }
  .card .grade small { display: block; font-size: 9px; letter-spacing: 0.06em; }
  .card .grade b { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
  .card .price { margin-top: 8px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; font-variant-numeric: tabular-nums; }
  .card .price b { font-size: 17px; }
  .card .price em { font-style: normal; font-weight: 600; color: var(--good); }

  .joy { position: absolute; bottom: 20px; width: 132px; height: 132px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line); touch-action: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); opacity: 0.9; pointer-events: none; }
  .btns { position: absolute; bottom: 20px; display: grid; gap: 10px; justify-items: end; }
  .btn { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn[aria-pressed="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { position: absolute; bottom: 166px; font-size: 12px; color: var(--fg); background: var(--chip); border-radius: 999px; padding: 6px 12px; transition: opacity 0.6s; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
  .hint.gone { opacity: 0; }
  .card:not([hidden]) ~ .hint { display: none; }
  .card .more { margin-top: 10px; width: 100%; padding: 9px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
  .qs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 74%; overflow: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 34px rgba(0, 0, 0, 0.35); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
  .qs[hidden] { display: none !important; }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .qhead h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
  .qunit { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .qgrade { flex: none; text-align: center; border: 2px solid var(--good); color: var(--good); border-radius: 10px; padding: 4px 12px 5px; line-height: 1.1; }
  .qgrade small { display: block; font-size: 10px; letter-spacing: 0.06em; }
  .qgrade b { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  .qprice { margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .qprice b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .qprice em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--good); }
  .qbars, .qscores { margin-top: 8px; display: grid; gap: 7px; }
  .qbar { display: grid; grid-template-columns: 76px 1fr 72px; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .qscores .qbar { grid-template-columns: 76px 1fr 32px; }
  .qtrack { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .qfill { height: 100%; border-radius: 4px; background: var(--muted); }
  .qbar.ours .qfill { background: var(--accent); }
  .qscores .qfill { background: var(--good); }
  .qbar b { text-align: right; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
  .qlabel { margin: 16px 0 4px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .qsum { margin: 14px 0 0; font-size: 14px; line-height: 1.6; max-width: 60ch; }
  .qtags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; }
  .qtags li { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line); }
  .qnote { margin: 16px 0 12px; font-size: 12px; color: var(--muted); }
  .nogl { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); }
  .app.nogl-on .nogl { display: flex; }
  .app.nogl-on #gl, .app.nogl-on .joy, .app.nogl-on .btns, .app.nogl-on .minimap, .app.nogl-on .hint { display: none; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .hint { transition: none; } }
</style>

<div class="app" id="app">
  <canvas id="gl" aria-label="RE:LOCAL 2026 CO-SHOW 가상 전시장. 왼쪽 아래 조이스틱으로 걷고, 화면을 끌어서 시야를 돌립니다."></canvas>

  <div class="topbar hud-x">
    <div class="plate"><small>MARKETLOG · CO-SHOW 2026</small><strong>3D 가상 시장</strong><span id="stats"></span></div>
    <a class="sample" id="myLink" href="#" hidden>내 가게 페이지</a>
  </div>
  <canvas class="minimap" id="mini" width="144" height="186" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status"></div>

  <div class="card hud-x" id="card" hidden></div>
  <div class="hint hud-x" id="hint">조이스틱 위아래는 걷기, 좌우는 몸 돌리기 · 가게를 누르면 정보가 보여요</div>

  <div class="joy" id="joy" style="left:max(16px, env(safe-area-inset-left, 0px))"><i id="knob"></i></div>
  <div class="btns" style="right:max(16px, env(safe-area-inset-right, 0px))">
    <button class="btn primary" id="goMine" type="button">내 가게로 가기</button>
    <button class="btn" id="aerial" type="button" aria-pressed="false">위에서 보기</button>  </div>
  <section class="qs" id="qs" hidden aria-live="polite"></section>
  <p class="nogl" id="nogl">이 기기에서는 3D 화면을 열 수 없습니다. 다른 브라우저로 열어 주세요.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
/* 마켓로그 CO-SHOW 3D 가상 시장 — 팀원 데모(coshow-market-demo)를 실제 부스 가게 데이터에 연결한 버전.
   ?shop={가게 id} 로 열면 내 가게 앞에서 시작한다. 데이터: GET /api/v1/booth/market (몇 초마다 다시 불러 새 가게를 세움) */
var MARKET_PARAMS = new URLSearchParams(location.search);
var MARKET_API = (function () {
  var o = MARKET_PARAMS.get("api");
  if (o) return o.replace(/\/$/, "");
  /* 로컬 개발: 화면(3000)과 API(8000) 포트가 다르다. 배포: 같은 주소 */
  if (location.port === "3000" || location.port === "5173") return location.protocol + "//" + location.hostname + ":8000";
  return location.origin;
})();
function loadMarket() {
  return fetch(MARKET_API + "/api/v1/booth/market", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) { return j.shops || []; });
}
loadMarket().then(function (shops) { startMarket(shops, MARKET_PARAMS.get("shop")); }).catch(function () {
  var app = document.getElementById("app"), msg = document.getElementById("nogl");
  msg.textContent = "시장 정보를 불러오지 못했어요. 잠시 후 새로고침해 주세요."; app.classList.add("nogl-on");
});
function startMarket(SHOP_DATA, MINE_ID) {
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), canvas = $("gl");
  if (typeof THREE === "undefined") { app.classList.add("nogl-on"); return; }
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (e) { app.classList.add("nogl-on"); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; /* film-style highlight roll-off instead of flat clipping */
  renderer.toneMappingExposure = 0.9;

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement;
  function cssVar(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }

  /* ---------- 실제 가게 데이터 ---------- */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2026);
  /* 품목별 진열 모양·색 (품목 인식 모델의 10종 + 자주 나오는 과일). s: 3D 모양 */
  var FRUITS = [
    { n: "과일", c: 0xe0a030, s: "ball" },
    { n: "사과", c: 0xc8372d, s: "apple" },
    { n: "배", c: 0xd9b56a, s: "pear" },
    { n: "감귤", c: 0xf08a1c, s: "citrus" },
    { n: "감", c: 0xe8731c, s: "citrus" },
    { n: "딸기", c: 0xe0314b, s: "berry" },
    { n: "포도", c: 0x9ac43c, s: "grape" },
    { n: "양파", c: 0xc98a4b, s: "ball" },
    { n: "무", c: 0xf1f0e6, s: "ball" },
    { n: "양배추", c: 0xa8d38a, s: "ball" },
    { n: "배추", c: 0x8fc46a, s: "ball" },
    { n: "마늘", c: 0xf3eee2, s: "ball" },
    { n: "감자", c: 0xb88a5a, s: "ball" }
  ];
  /* 상품명에서 품목 찾기 — 긴 이름부터(양배추 → 배추 → 배, 감귤 → 감) */
  var MATCH = [["양배추", 9], ["배추", 10], ["감귤", 3], ["귤", 3], ["샤인", 6], ["머스켓", 6], ["포도", 6], ["딸기", 5], ["사과", 1], ["양파", 7], ["마늘", 11], ["감자", 12], ["배", 2], ["감", 4], ["무", 8]];
  function fruitIndex(title) { title = title || ""; for (var i = 0; i < MATCH.length; i++) if (title.indexOf(MATCH[i][0]) >= 0) return MATCH[i][1]; return 0; }
  var AWN = [0x0052ff, 0x2f7d5b, 0xe58a1f, 0xd2432d, 0x8b4a8f, 0x1f8a8a];
  var SIGN = [0xe4ecf8, 0xe7f3ea, 0xfff1d9, 0xfde8e4, 0xf3e7f4, 0xeaf4f4];
  function gradeName(g) { return g === "A+" ? "특상" : g ? "보통" : "-"; }
  /* 서버 데이터 한 건을 매대(stall)에 채운다 */
  function fillStall(st, d) {
    var p = d.product, r = rng(d.number * 7919);
    st.storeId = d.storeId; st.number = d.number; st.name = d.name; st.tagline = d.tagline || "";
    st.count = d.productCount || 0; st.has = !!p;
    st.title = p ? p.title : "준비 중"; st.unit = p ? p.unit : ""; st.fi = fruitIndex(st.title); st.fruit = FRUITS[st.fi];
    st.price = p ? p.price : 0; st.pub = p ? p.publicPrice : 0; st.grade = p ? p.grade : ""; st.conf = p ? p.confidence : null;
    st.attrs = p ? p.attributeLabels || {} : {}; st.sum = p ? (p.aiSummary || "") : ""; st.tags = p ? p.tags || [] : [];
    st.awn = AWN[Math.floor(r() * AWN.length)]; st.sign = SIGN[Math.floor(r() * SIGN.length)];
    st.mine = !!MINE_ID && d.storeId === MINE_ID;
  }
  function pctOf(st) { return st.pub > 0 ? Math.round((1 - st.price / st.pub) * 100) : null; }
  /* ---------- hall plan: stalls in 12 x 12 slots, opened from the center outward ---------- */
  var COLS = 12, ROWS = 12, CAP = COLS * ROWS, OFF = 1.3, PITCH = 3.4, X0 = 4.8;
  var HX = 31, HZ0 = -36, HZ1 = 44, HH = 12, ARCH_Z = 31;
  var slots = [];
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var p = Math.floor(r / 2), side = r % 2;
    slots.push({ x: c < 6 ? -(X0 + c * PITCH) : X0 + (c - 6) * PITCH, z: (p - 2.5) * 10 + (side ? OFF : -OFF), ry: side ? 0 : Math.PI, side: side });
  }
  var order = slots.map(function (s, i) { return { i: i, d: s.x * s.x + s.z * s.z + rand() * 60 }; })
    .sort(function (a, b) { return a.d - b.d; }).map(function (o) { return o.i; });
  var stalls = order.map(function (si) {
    var s = slots[si];
    return { x: s.x, z: s.z, ry: s.ry, side: s.side, name: "", fruit: FRUITS[0], fi: 0, price: 0, pub: 0, grade: "", awn: AWN[0], sign: SIGN[0], mine: false, attrs: {}, sum: "", tags: [], title: "", unit: "" };
  });
  SHOP_DATA = SHOP_DATA.slice(-CAP);
  SHOP_DATA.forEach(function (d, k) { fillStall(stalls[k], d); });
  var MINE = -1;
  stalls.forEach(function (st, k) { if (st.mine && MINE < 0) MINE = k; });
  var filled = SHOP_DATA.length;

  /* ---------- scene ---------- */
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.1, 260);
  var hemi = new THREE.HemisphereLight(0xffffff, 0x6b707a, 0.22); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1d6, 0.5); sun.position.set(20, 40, 15);
  sun.castShadow = true; sun.shadow.mapSize.set(Math.min(innerWidth, innerHeight) > 700 ? 2048 : 1024, Math.min(innerWidth, innerHeight) > 700 ? 2048 : 1024);
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  var shc = sun.shadow.camera; shc.left = -16; shc.right = 16; shc.top = 16; shc.bottom = -16; shc.near = 1; shc.far = 90;
  scene.add(sun); scene.add(sun.target);
  scene.fog = new THREE.Fog(0x15161a, 60, 150);

  /* sky only matters from the bird's-eye view, where the ceiling is hidden */
  var skyU = { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, gamma: { value: 1 } };
  var sky = new THREE.Mesh(new THREE.SphereGeometry(200, 24, 12), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
    vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 bot; uniform float gamma; varying vec3 vP; void main(){ float h = smoothstep(0.0, 0.55, normalize(vP).y); vec3 c = mix(bot, top, h); gl_FragColor = vec4(gamma > 0.5 ? pow(c, vec3(1.0 / 2.2)) : c, 1.0); }"
  }));
  scene.add(sky);
  function applyTheme() { skyU.top.value.set(cssVar("--sky-top")).convertSRGBToLinear(); skyU.bot.value.set(cssVar("--sky-bot")).convertSRGBToLinear(); }
  applyTheme();
  if (window.matchMedia) { var mq = window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", applyTheme); }
  new MutationObserver(applyTheme).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

  var composer = null, useFx = false; /* no post effects: plain, physically based rendering */

  /* image-based lighting: a small procedural exhibition hall (dark room, bright ceiling panels, warm wall wash) is baked into an
     environment map, so every material gets realistic ambient light and reflections */
  (function buildEnv() {
    try {
      var envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.BoxGeometry(60, 24, 80), new THREE.MeshBasicMaterial({ color: 0x20232a, side: THREE.BackSide })));

    var want = {}; near.forEach(function (n) { want[n.i] = true; });
    labels.forEach(function (l) { if (l.slot >= 0 && !want[l.slot]) { l.slot = -1; l.sp.visible = false; } });
    near.forEach(function (n) {
      for (var q = 0; q < labels.length; q++) if (labels[q].slot === n.i) return;
      for (var q2 = 0; q2 < labels.length; q2++) if (labels[q2].slot === -1) {
        var l = labels[q2], s = stalls[n.i]; l.slot = n.i; drawLabel(l, s.name, s.mine); l.sp.position.set(s.x, 3.95, s.z); l.sp.visible = true; return;
      }
    });
  }

  function resize() {
    var w = app.clientWidth, h = app.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); if (composer) composer.setSize(w, h); camera.aspect = w / h; camera.fov = camera.aspect < 0.8 ? 82 : 66; camera.updateProjectionMatrix();
    if (!aerial) cam.gDist = homeDist();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener("resize", resize);
  resize(); cam.dist = cam.gDist; cam.eff = cam.dist;

  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

    /* move */
    var ix = joy.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
    var iy = joy.y + ((keys.w || keys.arrowup) ? 1 : 0) - ((keys.s || keys.arrowdown) ? 1 : 0);
    var mx = 0, mz = 0, len = Math.hypot(ix, iy);
    if (len > 0.08) {
      if (len > 1) { ix /= len; iy /= len; }
      /* first person: left/right turns your body (yaw), up/down walks forward/back. Bird's-eye keeps the sideways move. */
      if (!aerial) { cam.yaw -= ix * 2.1 * dt; ix = 0; lookAt = null; }
      var sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
      mx = -sy * iy + cy * ix; mz = -cy * iy - sy * ix;
    } else if (auto) {
      var ax = auto.x - player.x, az = auto.z - player.z, ad = Math.hypot(ax, az);
      if (ad < 0.4) { auto = null; lookAt = { x: mine.x, z: mine.z, t: 1.2 }; }
      else {
        mx = ax / ad * 0.9; mz = az / ad * 0.9;
        if (!aerial) { var wy = Math.atan2(-ax, -az), wd = wy - cam.yaw; while (wd > Math.PI) wd -= 6.283; while (wd < -Math.PI) wd += 6.283; cam.yaw += wd * Math.min(1, dt * 4); }
      }
    }
    if (mx || mz) {
      var sp = 5.2 * dt, nx = player.x + mx * sp, nz = player.z + mz * sp;
      if (!blocked(nx, player.z)) player.x = clamp(nx, -26, 26);
      if (!blocked(player.x, nz)) player.z = clamp(nz, -31.5, 41.5);
      var tf = Math.atan2(mx, mz), df = tf - player.face; while (df > Math.PI) df -= 6.283; while (df < -Math.PI) df += 6.283; player.face += df * Math.min(1, dt * 12);
    }
    if (lookAt && !aerial) {
      var tyw = Math.atan2(-(lookAt.x - player.x), -(lookAt.z - player.z)), dyw = tyw - cam.yaw; while (dyw > Math.PI) dyw -= 6.283; while (dyw < -Math.PI) dyw += 6.283;
      cam.yaw += dyw * Math.min(1, dt * 5); lookAt.t -= dt; if (lookAt.t <= 0) lookAt = null;
    }
    me.position.set(player.x, 0, player.z); me.rotation.y = player.face;
    meBody.position.y = 0.5 + ((mx || mz) ? Math.abs(Math.sin(t * 10)) * 0.05 : 0);

    /* camera: pull in whenever something would be between us and the player */
    var k = reduced ? 1 : 1 - Math.pow(0.002, dt);
    cam.dist += (cam.gDist - cam.dist) * k; cam.pitch += (cam.gPitch - cam.pitch) * k;
    var tx = aerial ? player.x * 0.3 : player.x, tz = aerial ? player.z * 0.3 : player.z, ty = aerial ? 0 : 1.3, cp = Math.cos(cam.pitch);
    var ddx = Math.sin(cam.yaw) * cp, ddy = Math.sin(cam.pitch), ddz = Math.cos(cam.yaw) * cp;
    var wantD = cam.dist;
    cam.eff = wantD < cam.eff ? wantD : cam.eff + (wantD - cam.eff) * Math.min(1, dt * 4);
    if (aerial) {
      camera.position.set(tx + ddx * cam.eff, ty + ddy * cam.eff, tz + ddz * cam.eff);
      camera.lookAt(tx, ty, tz);
    } else {
      /* first person: eyes at 1.62 m, turn 360 degrees by dragging, tilt up/down within +-70 degrees */
      var eye = 1.62 + ((mx || mz) && !reduced ? Math.sin(t * 9) * 0.03 : 0), lpc = Math.cos(cam.lp);
      camera.position.set(player.x, eye, player.z);
      camera.lookAt(player.x - Math.sin(cam.yaw) * lpc, eye + Math.sin(cam.lp), player.z - Math.cos(cam.yaw) * lpc);
    }

    stepWalkers(dt, t);
    sun.position.set(player.x + 18, 36, player.z + 14); sun.target.position.set(player.x, 0, player.z); sun.target.updateMatrixWorld();
    lodTimer -= dt; if (lodTimer <= 0) { lodTimer = 0.2; updateDetail(); }

    /* 새로 문을 연 가게: 서버에서 받아 온 순서대로 하나씩 솟아오르게 */
    spawnTimer -= dt;
    if (spawnTimer <= 0 && pending.length && filled < CAP && !spawn) {
      spawnTimer = 1.2; var nk = filled; fillStall(stalls[nk], pending.shift()); paintSlot(nk); filled++;
      parts.forEach(function (o) { o.mesh.count = filled; }); aoM.count = filled; setAO(nk); setSlot(nk, 0.001); spawn = { k: nk, t: 0 };
      toast(stalls[nk].name + "이(가) 문을 열었어요 · No." + stalls[nk].number); stats(); feedTex.redraw(); topTex.redraw();
    }
    if (spawn) {
      spawn.t += dt / 0.7; var u = Math.min(spawn.t, 1), sc = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2); setSlot(spawn.k, u >= 1 ? 1 : Math.max(sc, 0.001)); if (u >= 1) spawn = null;
    }

    lblTimer -= dt; if (lblTimer <= 0) { lblTimer = 0.25; updateLabels(); }

    /* info card: nearest stall front within reach, or the one that was tapped */
    var best = -1, bd = 9;
    for (var i = 0; i < filled; i++) { var s = stalls[i], fz = s.z + (s.side ? 2.0 : -2.0), d2 = (s.x - player.x) * (s.x - player.x) + (fz - player.z) * (fz - player.z); if (d2 < bd) { bd = d2; best = i; } }
    if (best >= 0 && !visited[best]) { visited[best] = true; stampN++; stats(); }
    showCard(performance.now() < cardUntil ? cardSlot : best);

    var pulse = reduced ? 0.5 : 0.5 + 0.2 * Math.sin(t * 3);
    beacon.material.opacity = pulse; pad.scale.setScalar(1 + (reduced ? 0 : 0.12 * Math.sin(t * 3)));

    miniTimer -= dt; if (miniTimer <= 0) { miniTimer = 0.1; drawMini(); }
    if (useFx && composer) composer.render(dt); else renderer.render(scene, camera);
    /* turn the effects off by themselves if the device can't keep up */
    if (useFx) {
      slow = dt > 0.034 ? slow + 1 : Math.max(0, slow - 2);
      if (slow > 150) { useFx = false; skyU.gamma.value = 1; fxBtn.textContent = "화질 효과 켜기"; toast("성능을 위해 화질 효과를 껐어요"); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
