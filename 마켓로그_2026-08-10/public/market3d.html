<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}</style></head><body>
<title>CO-SHOW 3D 공항 마켓 | 마켓로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 폰트·three.js는 앱에 포함된 파일(/vendor)을 쓴다 — 인터넷이 불안정해도 3D 시장이 뜨게 -->
<link rel="stylesheet" href="/vendor/jua/jua.css">
<link rel="stylesheet" href="/vendor/pretendard/pretendard.css">
<style>
  /* Layout: phone-first. One full-screen 3D exhibition hall (RE:LOCAL / 2026 CO-SHOW): dark floor, yellow accents, white booth partitions.
     HUD floats over it: title + minimap on top, info card above a joystick (left) and two buttons (right). */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #0052ff;
    --accent-ink: #ffffff;
    --good: #059669;
    --sky-top: #bfe2f1;
    --sky-bot: #f0ecdf;
    --chip: rgba(255, 255, 255, 0.92);
    --font-display: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101715; --surface: #18211e; --fg: #e8f1ed; --muted: #9bafa7; --line: #2a3833;
      --accent: #4d8bff; --accent-ink: #ffffff; --good: #4cc38a;
      --sky-top: #121c2b; --sky-bot: #2b2a31; --chip: rgba(24, 33, 30, 0.9);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101715; --surface: #18211e; --fg: #e8f1ed; --muted: #9bafa7; --line: #2a3833;
    --accent: #4d8bff; --accent-ink: #ffffff; --good: #4cc38a;
    --sky-top: #121c2b; --sky-bot: #2b2a31; --chip: rgba(24, 33, 30, 0.9);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  button { font: inherit; color: inherit; }
  .app { position: relative; height: 100%; overflow: hidden; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }

  .hud-x { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { position: absolute; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .plate { background: var(--chip); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; min-width: 0; }
  .plate small { display: block; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .plate strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.25; }
  .plate span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sample { pointer-events: auto; font-size: 12px; font-weight: 800; color: var(--accent); background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; text-decoration: none; }
  .qbar.attr .qfill { background: var(--fill, var(--good)); }
  .qbar.attr b { color: var(--fill, var(--good)); font-weight: 700; }
  .qlink { display: block; text-align: center; text-decoration: none; margin-top: 8px; }

  .minimap { position: absolute; top: 60px; right: max(16px, env(safe-area-inset-right, 0px)); width: 72px; height: 93px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); pointer-events: none; }

  .toast { position: absolute; top: 72px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 130px); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }

  /* bottom 206px: 오른쪽 버튼 묶음(점프 + 내 가게로 + 위에서 보기, 약 196px)보다 위에 떠서 가리지 않게 */
  .card { position: absolute; bottom: 206px; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
  .card[hidden] { display: none !important; }
  .card .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.2; }
  .card .meta { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .card .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-right: 6px; }
  .card .grade { flex: none; text-align: center; border: 2px solid var(--good); color: var(--good); border-radius: 9px; padding: 2px 10px 3px; line-height: 1.1; }
  .card .grade small { display: block; font-size: 9px; letter-spacing: 0.06em; }
  .card .grade b { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
  .card .price { margin-top: 8px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; font-variant-numeric: tabular-nums; }
  .card .price b { font-size: 17px; }
  .card .price em { font-style: normal; font-weight: 600; color: var(--good); }

  .joy { position: absolute; bottom: 20px; width: 132px; height: 132px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line); touch-action: none; }
  .joy i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--accent); opacity: 0.9; pointer-events: none; }
  .btns { position: absolute; bottom: 20px; display: grid; gap: 10px; justify-items: end; }
  .btn { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn[aria-pressed="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 점프 버튼: 엄지로 누르기 쉽게 크고 둥글게. 누르는 순간 반응하도록 pointerdown으로 처리한다 */
  .btn.jump { width: 72px; height: 72px; padding: 0; border-radius: 50%; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); touch-action: none; user-select: none; -webkit-user-select: none; }
  .btn.jump:active { transform: scale(0.92); }
  .hint { position: absolute; bottom: 206px; font-size: 12px; color: var(--fg); background: var(--chip); border-radius: 999px; padding: 6px 12px; transition: opacity 0.6s; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
  .hint.gone { opacity: 0; }
  .card:not([hidden]) ~ .hint { display: none; }
  /* 카드 안 진열 상품 목록 — 앱 "오늘의 진열대"와 같은 모양(등급 배지 · 이름 · 가격) */
  .card .items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 172px; overflow-y: auto; }
  .card .items button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .card .items button:active { transform: scale(0.98); }
  .card .items button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .ig { flex: none; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); }
  .card .ig.top { background: var(--good); border-color: var(--good); color: #fff; }
  .card .it { flex: 1; min-width: 0; display: grid; }
  .card .it b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .it small { font-size: 11px; color: var(--muted); }
  .card .ip { flex: none; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .card .cclose { flex: none; width: 36px; height: 36px; margin: -4px -6px 0 0; border: 0; border-radius: 50%; background: var(--chip); color: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
  .card .cclose:focus-visible, .reopen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 카드를 닫았을 때 그 자리에 남는 다시 보기 버튼 */
  .reopen { position: absolute; bottom: 206px; left: max(16px, env(safe-area-inset-left, 0px)); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); cursor: pointer; }
  .reopen[hidden] { display: none; }
  .qpick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .qpick button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
  .qpick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .card .more { margin-top: 10px; width: 100%; padding: 9px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
  .qs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-height: 74%; overflow: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 34px rgba(0, 0, 0, 0.35); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
  .qs[hidden] { display: none !important; }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .qhead h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
  .qunit { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .qgrade { flex: none; text-align: center; border: 2px solid var(--good); color: var(--good); border-radius: 10px; padding: 4px 12px 5px; line-height: 1.1; }
  .qgrade small { display: block; font-size: 10px; letter-spacing: 0.06em; }
  .qgrade b { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  .qprice { margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .qprice b { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .qprice em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--good); }
  .qbars, .qscores { margin-top: 8px; display: grid; gap: 7px; }
  .qbar { display: grid; grid-template-columns: 76px 1fr 72px; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .qscores .qbar { grid-template-columns: 76px 1fr 32px; }
  .qtrack { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .qfill { height: 100%; border-radius: 4px; background: var(--muted); }
  .qbar.ours .qfill { background: var(--accent); }
  .qscores .qfill { background: var(--good); }
  .qbar b { text-align: right; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
  .qlabel { margin: 16px 0 4px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .qsum { margin: 14px 0 0; font-size: 14px; line-height: 1.6; max-width: 60ch; }
  .qtags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; padding: 0; list-style: none; }
  .qtags li { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line); }
  .qopts { display: grid; gap: 8px; margin-top: 12px; }
  .qopts .btn { width: 100%; text-align: left; font-size: 15px; padding: 13px 16px; }
  /* 상품 상세(앱 상품설명 탭과 같은 모양). 앱처럼 항상 밝은 화면으로 보여준다 */
  .qs.ps { padding: 0; max-height: 88%; background: #F8FAFC; color: #0F172A; border-top: 0; }
  .ps-hero { position: relative; height: 220px; background: #0F172A; overflow: hidden; border-radius: 18px 18px 0 0; }
  .ps-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ps-hero.noimg img { display: none; }
  .ps-grad { position: absolute; inset: 0; background: linear-gradient(to top, #0F172A, rgba(0,0,0,0.2) 45%, transparent); }
  .ps-badge { position: absolute; top: 14px; right: 58px; display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; background: #0052FF; color: #fff; font-size: 12px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .ps-badge.top { background: #00C875; }
  .ps-x { position: absolute; top: 10px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); color: #0F172A; font-size: 22px; line-height: 1; cursor: pointer; }
  .ps-body { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
  .ps-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .ps-pick button { padding: 7px 14px; border-radius: 999px; border: 1px solid #E2E8F0; background: #fff; color: #475569; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .ps-pick button[aria-pressed="true"] { background: #0052FF; border-color: #0052FF; color: #fff; }
  .ps-head { display: flex; justify-content: space-between; align-items: center; }
  .ps-shop { color: #0052FF; font-weight: 700; font-size: 14px; }
  .ps-shop small { color: #94A3B8; font-weight: 600; font-size: 12px; margin-left: 4px; }
  .ps-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; border: 1px solid #DBEAFE; background: #EFF6FF; color: #0052FF; }
  .ps-pill.top { border-color: #A7F3D0; background: #ECFDF5; color: #10B981; }
  .ps-title { margin: -6px 0 0; font-size: 21px; font-weight: 600; line-height: 1.35; }
  .ps-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -4px; }
  .ps-tags span { padding: 4px 10px; border-radius: 999px; background: #ECFDF5; color: #047857; font-size: 11px; font-weight: 700; }
  .ps-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 16px 16px 18px; box-shadow: 0 4px 12px rgba(15,23,42,0.08); display: grid; gap: 12px; }
  .ps-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #D1D1D1; }
  .ps-lbl { font-size: 12px; font-weight: 700; }
  .ps-price { font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ps-price em { font-style: normal; font-size: 11px; font-weight: 600; color: #0052FF; background: #EFF6FF; padding: 2px 6px; border-radius: 999px; vertical-align: 3px; }
  .ps-ai-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ps-ai-head h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
  .ps-ai-head .ps-pill { font-size: 12px; padding: 4px 10px; }
  .ps-metrics { display: grid; }
  .ps-m + .ps-m { border-top: 1px solid #D1D1D1; margin-top: 12px; padding-top: 12px; }
  .ps-mrow { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 5px; }
  .ps-mrow span { font-weight: 700; color: #0F172A; }
  .ps-mrow b { font-size: 14px; font-weight: 900; }
  .ps-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .ps-bars i { position: relative; display: block; height: 10px; border-radius: 6px; background: #E2E8F0; border: 1px solid #CBD5E1; border-top-color: rgba(255,255,255,0.7); box-shadow: inset 0 2px 4px rgba(15,23,42,0.16), inset 0 -1px 1px rgba(255,255,255,0.75); overflow: hidden; }
  .ps-bars i::after { content: ""; position: absolute; left: 4px; right: 4px; top: 1px; height: 1px; border-radius: 999px; background: rgba(255,255,255,0.6); }
  .ps-talk b svg { vertical-align: -4px; margin-right: 6px; }
  .ps-sum { border-top: 1px solid #D1D1D1; padding-top: 12px; }
  .ps-sum b { display: block; color: #0052FF; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
  .ps-sum p, .ps-talk p { margin: 0; font-size: 12px; line-height: 1.6; color: #334155; font-weight: 500; }
  .ps-talk { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 12px rgba(15,23,42,0.08); }
  .ps-talk b { display: block; color: #B45309; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
  .ps-note { margin: 0; font-size: 11px; color: #94A3B8; }
  .ps-empty { margin: 0; font-size: 14px; color: #475569; }
  .ps-btn { display: block; width: 100%; text-align: center; text-decoration: none; padding: 14px; border-radius: 16px; border: 1px solid #E2E8F0; background: #fff; color: #0F172A; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-sizing: border-box; }
  .ps-btn.primary { background: #0052FF; border-color: #0052FF; color: #fff; }
  .ps-btn:focus-visible, .ps-x:focus-visible, .ps-pick button:focus-visible { outline: 2px solid #0052FF; outline-offset: 2px; }
  .qnote { margin: 16px 0 12px; font-size: 12px; color: var(--muted); }
  .nogl { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); }
  .app.nogl-on .nogl { display: flex; }
  .app.nogl-on #gl, .app.nogl-on .joy, .app.nogl-on .btns, .app.nogl-on .minimap, .app.nogl-on .hint { display: none; }

</style>

<div class="app" id="app">
  <canvas id="gl" aria-label="RE:LOCAL 2026 CO-SHOW 가상 전시장. 왼쪽 아래 조이스틱으로 걷고, 화면을 끌어서 시야를 돌립니다."></canvas>

  <div class="topbar hud-x">
    <div class="plate"><small>MARKETLOG AIRPORT ✈ CO-SHOW 2026</small><strong>3D 공항 마켓</strong><span id="stats"></span></div>
    <a class="sample" id="myLink" href="#" hidden>내 가게 페이지</a>

<script src="/vendor/three/three-r128.min.js"></script><script>
/* 마켓로그 CO-SHOW 3D 가상 시장 — 팀원 데모(coshow-market-demo)를 실제 부스 가게 데이터에 연결한 버전.
   ?shop={가게 id} 로 열면 내 가게 앞에서 시작한다. 데이터: GET /api/v1/booth/market (몇 초마다 다시 불러 새 가게를 세움) */
var MARKET_PARAMS = new URLSearchParams(location.search);
var MARKET_API = (function () {
  var o = MARKET_PARAMS.get("api");
  if (o) return o.replace(/\/$/, "");
  /* 로컬 개발: 화면(3000)과 API(8000) 포트가 다르다. 배포: 같은 주소 */
  if (location.port === "3000" || location.port === "5173") return location.protocol + "//" + location.hostname + ":8000";
  return location.origin;

    cam.dist += (cam.gDist - cam.dist) * k; cam.pitch += (cam.gPitch - cam.pitch) * k;
    var tx = aerial ? player.x * 0.3 : player.x, tz = aerial ? player.z * 0.3 : player.z, ty = aerial ? 0 : 1.3, cp = Math.cos(cam.pitch);
    var ddx = Math.sin(cam.yaw) * cp, ddy = Math.sin(cam.pitch), ddz = Math.cos(cam.yaw) * cp;
    var wantD = cam.dist;
    cam.eff = wantD < cam.eff ? wantD : cam.eff + (wantD - cam.eff) * Math.min(1, dt * 4);
    if (aerial) {
      camera.position.set(tx + ddx * cam.eff, ty + ddy * cam.eff, tz + ddz * cam.eff);
      camera.lookAt(tx, ty, tz);
    } else {
      /* first person: eyes at 1.62 m, turn 360 degrees by dragging, tilt up/down within +-70 degrees */
      var eye = player.y + 1.62 + ((mx || mz) && player.grounded && !reduced ? Math.sin(t * 9) * 0.03 : 0), lpc = Math.cos(cam.lp);
      camera.position.set(player.x, eye, player.z);
      camera.lookAt(player.x - Math.sin(cam.yaw) * lpc, eye + Math.sin(cam.lp), player.z - Math.cos(cam.yaw) * lpc);
    }

    stepWalkers(dt, t);
    stepApples(dt, t);
    sun.position.set(player.x + 18, 36, player.z + 14); sun.target.position.set(player.x, 0, player.z); sun.target.updateMatrixWorld();
    lodTimer -= dt; if (lodTimer <= 0) { lodTimer = 0.2; updateDetail(); }

    /* 새로 문을 연 가게: 서버에서 받아 온 순서대로 하나씩 솟아오르게 */
    spawnTimer -= dt;
    if (spawnTimer <= 0 && pending.length && filled < CAP && !spawn) {
      spawnTimer = 1.2; var nk = filled; fillStall(stalls[nk], pending.shift()); paintSlot(nk); filled++;
      parts.forEach(function (o) { o.mesh.count = filled; }); aoM.count = filled; setAO(nk); setSlot(nk, 0.001); spawn = { k: nk, t: 0 };
      toast(stalls[nk].name + "이(가) 문을 열었어요 · No." + stalls[nk].number); stats(); feedTex.redraw(); topTex.redraw(); bigTex.redraw();
    }
    if (spawn) {
      spawn.t += dt / 0.7; var u = Math.min(spawn.t, 1), sc = 1 + 2.2 * Math.pow(u - 1, 3) + 1.2 * Math.pow(u - 1, 2); setSlot(spawn.k, u >= 1 ? 1 : Math.max(sc, 0.001)); if (u >= 1) spawn = null;
    }

    lblTimer -= dt; if (lblTimer <= 0) { lblTimer = 0.25; updateLabels(); }

    /* info card: nearest stall front within reach, or the one that was tapped */
    var best = -1, bd = 9;
    for (var i = 0; i < filled; i++) { var s = stalls[i], fz = s.z + (s.side ? 2.0 : -2.0), d2 = (s.x - player.x) * (s.x - player.x) + (fz - player.z) * (fz - player.z); if (d2 < bd) { bd = d2; best = i; } }
    if (best >= 0 && !visited[best]) { visited[best] = true; stampN++; stats(); }
    var wantCard = performance.now() < cardUntil ? cardSlot : best;
    if (cardOff >= 0 && wantCard !== cardOff) cardOff = -1; /* 다른 가게로 가면 다시 자동으로 뜬다 */
    var off = cardOff >= 0;
    showCard(off ? -1 : wantCard);
    if (reopenEl.hidden !== !off) reopenEl.hidden = !off;

    var pulse = reduced ? 0.5 : 0.5 + 0.2 * Math.sin(t * 3);
    beacon.material.opacity = pulse; pad.scale.setScalar(1 + (reduced ? 0 : 0.12 * Math.sin(t * 3)));

    miniTimer -= dt; if (miniTimer <= 0) { miniTimer = 0.1; drawMini(); }
    if (useFx && composer) composer.render(dt); else renderer.render(scene, camera);
    /* turn the effects off by themselves if the device can't keep up */
    if (useFx) {
      slow = dt > 0.034 ? slow + 1 : Math.max(0, slow - 2);
      if (slow > 150) { useFx = false; skyU.gamma.value = 1; fxBtn.textContent = "화질 효과 켜기"; toast("성능을 위해 화질 효과를 껐어요"); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
