      body {

        color: #1E293B;
        -webkit-tap-highlight-color: transparent;
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

      /* Scanning animation */
      @keyframes scanline {
        0% { transform: translateY(-100%); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      .animate-scanline {
        animation: scanline 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
        70% { transform: scale(1.02); box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
        100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
      }
      .animate-pulse-ring {
        animation: pulse-ring 2s infinite;
      }

      /* Coupon styling */
      .coupon-ticket {
        position: relative;
        background: #ffffff;
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border-left: 6px solid #0052FF;
      }
      .coupon-ticket::before,
      .coupon-ticket::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 18px;
        height: 18px;
        background-color: #F8FAFC;
        border-radius: 50%;
        transform: translateY(-50%);
      }
      .coupon-ticket::before { left: -9px; }
      .coupon-ticket::after { right: -9px; }
      .coupon-divider { border-left: 2px dashed #E2E8F0; }

      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
